name: Frontend CI (build/test/docker)

on:
  push:
    branches: [ "main-clean", "feat/**", "fix/**", "chore/**" ]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    branches: [ "main-clean" ]
    paths:
      - "frontend/**"

permissions:
  contents: read
  packages: write

jobs:
  test-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Run tests
        run: |
          npm test --silent

      - name: Build Next.js
        run: npm run build

      - name: Log in to GHCR
        if: github.ref_name == 'main-clean'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push image
        if: github.ref_name == 'main-clean'
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/frontend:latest
            ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=https://aurapartnerai.com
            NEXT_PUBLIC_WS_URL=wss://aurapartnerai.com/ws
            NEXT_PUBLIC_APP_ENV=production
